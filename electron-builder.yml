# electron-builder configuration — produces Windows distributables.
# Run via `pnpm build:win`. Outputs to ./dist/.

appId: com.htownag.galaxycrafter
productName: GalaxyCrafter
copyright: Copyright © 2026 Ryan Atlee

directories:
  output: dist
  buildResources: build

# What goes inside the asar bundle.
# - out/**           — compiled main / preload / renderer from electron-vite
# - package.json     — required by Electron at runtime
# - reference-data/  — loaded at startup via `app.getAppPath()` (resource
#                      types, schematics, harvester catalogue, etc.)
# - drizzle/migrations/ — applied at first boot by drizzle-orm
# - node_modules/**  — production deps. better-sqlite3 (native binding),
#                      drizzle-orm, fast-xml-parser, react, etc. electron-
#                      builder auto-prunes devDependencies via its own
#                      dep-walk, but we DO need to opt into the bundle —
#                      omitting node_modules entirely (as the prior config
#                      did) drops better-sqlite3 and the app boots into a
#                      no-DB crash with no visible window. v0.1.0 shipped
#                      with this bug; fixed in v0.1.1.
files:
  - out/**
  - package.json
  - reference-data/**
  - drizzle/migrations/**
  - node_modules/**
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.test.*"
  - "!**/.DS_Store"
  - "!**/node_modules/*/{README.md,readme.md,README,readme,CHANGELOG.md,changelog.md,HISTORY.md,.github,.vscode,test,tests,docs,example,examples,__tests__,*.markdown}"
  - "!**/node_modules/**/*.{ts,map,d.ts}"
  - "!**/node_modules/**/{tsconfig.json,.eslintrc*,.prettierrc*,.npmignore,.gitignore,.travis.yml,appveyor.yml}"

# better-sqlite3 ships a native .node binding that can't run from inside an
# asar archive — Electron has to load it from the filesystem. Unpacking it
# lives in resources/app.asar.unpacked/node_modules/... alongside the asar.
asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/bindings/**"
  - "node_modules/file-uri-to-path/**"

# Rebuild native dependencies (better-sqlite3 etc) against Electron's Node ABI
# during packaging. pnpm install builds bindings against the system Node
# (NODE_MODULE_VERSION 127 for Node 22), but Electron 33 ships its own
# Node fork at NODE_MODULE_VERSION 130. Without this rebuild, the packaged
# app throws "compiled against a different Node.js version" at startup.
# Discovered + fixed in v0.1.1 after v0.1.0 shipped with the wrong binding.
npmRebuild: true

win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  # When a Windows-specific icon is added later, point this at build/icon.ico.
  # Electron's default icon is used until then.
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: GalaxyCrafter
  # Don't run silently after install — user expects to launch when ready.
  runAfterFinish: true
  uninstallDisplayName: ${productName} ${version}

# Auto-update placeholder. Populated when electron-updater is wired (deferred
# per docs/open-items.md). Until then the publish step is manual: drag the
# .exe + .zip into a GitHub Release.
publish:
  - provider: github
    owner: htownag
    repo: GalaxyCrafter
